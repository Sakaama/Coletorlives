{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-4">
        <div class="card p-4 text-center shadow-lg">
            <h3 class="text-warning fw-bold mb-4">TUTUCO CLOUD</h3>
            <form method="POST">
                <div class="mb-3">
                    <input type="password" name="password" class="form-control text-center" placeholder="Senha de Acesso" required>
                </div>
                <button type="submit" class="btn btn-warning w-100 fw-bold">ENTRAR</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
