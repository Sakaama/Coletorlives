<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutuco Cloud</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; }
        .navbar { border-bottom: 1px solid #333; }
        .card { background-color: #1e1e1e; border: 1px solid #333; }
    </style>
</head>
<body>
    {% if session.get('logged_in') %}
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand text-warning fw-bold" href="#">TUTUCO CLOUD</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'ai_dashboard' %}active{% endif %}" href="{{ url_for('ai_dashboard') }}">🤖 IA e Agente</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'editor_dashboard' %}active{% endif %}" href="{{ url_for('editor_dashboard') }}">✂️ Editores</a>
                    </li>
                </ul>
                <a href="{{ url_for('logout') }}" class="btn btn-outline-danger btn-sm">Sair</a>
            </div>
        </div>
    </nav>
    {% endif %}

    <div class="container">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-info">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
